<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#201333"><title>KG Corrida LIVE</title><style>*{box-sizing:border-box}body{margin:0;background:#120d20;color:white;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh}#top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;text-align:center;pointer-events:none;text-shadow:0 2px 5px #111}h1{font-size:clamp(18px,5vw,30px);margin:0;color:#ffe06c}#meta{font-weight:800;font-size:13px;margin-top:5px}#status{font-size:11px;margin-top:5px;color:#f8c8fc}#bottom{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:10px;right:10px;display:flex;justify-content:center;gap:5px;pointer-events:none;flex-wrap:wrap}#bottom span{background:#1d133ac9;border:1px solid #a990ff;padding:7px;border-radius:12px;font-size:10px;font-weight:800}#controls{position:fixed;right:10px;top:125px;display:flex;flex-direction:column;gap:7px}button{border:0;border-radius:12px;background:#ffe06c;color:#251337;padding:10px;font-weight:800;font-size:12px}#settings{position:fixed;inset:0;background:#100b1de8;display:none;align-items:center;justify-content:center;padding:20px}#settings.open{display:flex}#panel{background:#302149;border:1px solid #8e65d4;border-radius:20px;padding:22px;width:min(100%,390px)}input{display:block;width:100%;padding:12px;margin:8px 0 15px;background:#160d2a;border:1px solid #8e65d4;border-radius:9px;color:white}p{font-size:13px;line-height:1.5;color:#ddd}#notice{position:fixed;top:33%;left:0;right:0;text-align:center;font-size:22px;font-weight:900;text-shadow:0 3px 8px black;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="top"><h1>🏁 KG CORRIDA LIVE 🏁</h1><div id="meta">0 / 50 JOGADORES • RODADA 1</div><div id="status">Modo demonstração</div></div><div id="notice"></div><div id="controls"><button id="config">⚙️</button><button id="demo">👥 Demo</button><button id="reset">↻</button></div><div id="bottom"><span>💬 COMENTE = ENTRA</span><span>❤️ LIKE = IMPULSO</span><span>🎁 = TURBO</span><span>💣 GG = BOMBA</span></div><div id="settings"><div id="panel"><h2>⚙️ Configurar LIVE</h2><p>Para receber eventos reais, configure ADMIN_TOKEN no Render e conecte uma LIVE ativa.</p><label>Usuário TikTok<input id="username" placeholder="usuario_tiktok"></label><label>Token de administrador<input id="token" type="password" placeholder="ADMIN_TOKEN"></label><button id="connect">Conectar à LIVE</button> <button id="close">Fechar</button><p id="feedback"></p><small>Não digite a senha do TikTok. A conexão comunitária pode falhar.</small></div></div><script src="/socket.io/socket.io.js"></script><script src="/game.js"></script></body></html>
